<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">System architecture of the Multi-Agent Debate System</title>
  <desc id="desc">A visitor's browser talks to a Streamlit app (app.py) on a Hugging Face Space. app.py runs a LangGraph graph (debate_graph.py) whose three agents (pro_agent.py, con_agent.py, judge_agent.py) call three Groq models through llms.py. GitHub Actions deploys every push to main to the Space.</desc>
  <style>
    svg { --bg: #ffffff; --border: #d0d7de; --fg: #1f2328; --muted: #57606a; --stroke: #24292f; --soft: #8c959f; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --border: #30363d; --fg: #e6edf3; --muted: #9198a1; --stroke: #c9d1d9; --soft: #6e7681; }
    }
    .bg { fill: var(--bg); stroke: var(--border); }
    text { fill: var(--fg); font-family: Helvetica, Arial, sans-serif; font-size: 14px; }
    .t { font-size: 15px; font-weight: bold; }
    .b { font-weight: bold; }
    .s { fill: var(--muted); font-size: 12.5px; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cap { font-size: 11.5px; font-weight: bold; letter-spacing: 0.08em; fill: var(--muted); }
    .box { fill: var(--bg); stroke: var(--stroke); stroke-width: 1.4; }
    .group { fill: none; stroke: var(--soft); stroke-width: 1.4; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: var(--stroke); stroke-width: 1.4; }
    .head { fill: var(--stroke); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="639" rx="8"/>

  <!-- Visitor -->
  <rect class="box" x="164" y="20" width="320" height="52" rx="6"/>
  <text class="t" x="324" y="42" text-anchor="middle">Visitor’s browser</text>
  <text class="s" x="324" y="61" text-anchor="middle">types a claim, picks 1–10 rounds</text>
  <path class="edge" d="M290,72 V118" marker-end="url(#ah)"/>
  <text class="s" x="282" y="101" text-anchor="end">claim, rounds</text>
  <path class="edge" d="M358,118 V74" marker-end="url(#ah)"/>
  <text class="s" x="366" y="101">each round as soon as it’s judged, then the verdict</text>

  <!-- Hugging Face Space -->
  <rect class="group" x="24" y="120" width="620" height="372" rx="8"/>
  <text class="t" x="44" y="146">Hugging Face Space</text>
  <text class="s" x="210" y="146">Streamlit SDK 1.45 · Python 3.10 · pinned requirements.txt</text>

  <rect class="box" x="44" y="162" width="580" height="60" rx="6"/>
  <text x="60" y="186"><tspan class="m b">app.py</tspan><tspan> — Streamlit UI</tspan></text>
  <text class="s" x="60" y="207">key check · claim ≤ 600 chars · live rounds · friendly errors · st.session_state</text>
  <path class="edge" d="M334,222 V238" marker-end="url(#ah)"/>

  <rect class="box" x="44" y="240" width="580" height="60" rx="6"/>
  <text x="60" y="264"><tspan class="m b">debate_graph.py</tspan><tspan> — LangGraph StateGraph</tspan></text>
  <text class="s" x="60" y="285">pro → con → judge, repeated for each round → verdict · step limit 3 × rounds + 5</text>
  <path class="edge" d="M134,300 V320" marker-end="url(#ah)"/>
  <path class="edge" d="M334,300 V320" marker-end="url(#ah)"/>
  <path class="edge" d="M534,300 V320" marker-end="url(#ah)"/>

  <rect class="box" x="44" y="322" width="180" height="56" rx="6"/>
  <text class="m b" x="134" y="345" text-anchor="middle">pro_agent.py</text>
  <text class="s" x="134" y="366" text-anchor="middle">argues FOR the claim</text>
  <rect class="box" x="244" y="322" width="180" height="56" rx="6"/>
  <text class="m b" x="334" y="345" text-anchor="middle">con_agent.py</text>
  <text class="s" x="334" y="366" text-anchor="middle">argues AGAINST it</text>
  <rect class="box" x="444" y="322" width="180" height="56" rx="6"/>
  <text class="m b" x="534" y="345" text-anchor="middle">judge_agent.py</text>
  <text class="s" x="534" y="366" text-anchor="middle">scores 1–10, picks a winner</text>
  <path class="edge" d="M134,378 V398" marker-end="url(#ah)"/>
  <path class="edge" d="M334,378 V398" marker-end="url(#ah)"/>
  <path class="edge" d="M534,378 V398" marker-end="url(#ah)"/>

  <rect class="box" x="44" y="400" width="580" height="60" rx="6"/>
  <text x="60" y="424"><tspan class="m b">llms.py</tspan><tspan> — model names in one place + 3 ChatGroq clients</tspan></text>
  <text class="s" x="60" y="445">reads GROQ_API_KEY · swap models with PRO_MODEL, CON_MODEL, JUDGE_MODEL</text>

  <!-- Groq -->
  <path class="edge" d="M624,430 H682" marker-end="url(#ah)"/>
  <rect class="box" x="684" y="270" width="252" height="184" rx="6"/>
  <text class="t" x="700" y="296">Groq API</text>
  <text class="s" x="700" y="315">free tier · per-minute rate limits</text>
  <rect class="box" x="698" y="328" width="224" height="34" rx="4"/>
  <text class="b" x="712" y="350">PRO</text>
  <text class="m" x="770" y="350" style="font-size: 12.5px">openai/gpt-oss-20b</text>
  <rect class="box" x="698" y="370" width="224" height="34" rx="4"/>
  <text class="b" x="712" y="392">CON</text>
  <text class="m" x="770" y="392" style="font-size: 12.5px">qwen/qwen3.8-27b</text>
  <rect class="box" x="698" y="412" width="224" height="34" rx="4"/>
  <text class="b" x="712" y="434">JUDGE</text>
  <text class="m" x="770" y="434" style="font-size: 12.5px">openai/gpt-oss-120b</text>

  <!-- Deployment -->
  <text class="cap" x="24" y="532">DEPLOYMENT</text>
  <rect class="box" x="24" y="548" width="140" height="56" rx="6"/>
  <text class="b" x="94" y="571" text-anchor="middle">Developer</text>
  <text class="s m" x="94" y="592" text-anchor="middle">git push</text>
  <path class="edge" d="M164,576 H202" marker-end="url(#ah)"/>
  <rect class="box" x="204" y="548" width="180" height="56" rx="6"/>
  <text class="b" x="294" y="571" text-anchor="middle">GitHub repo</text>
  <text class="s m" x="294" y="592" text-anchor="middle">branch main</text>
  <path class="edge" d="M384,576 H422" marker-end="url(#ah)"/>
  <rect class="box" x="424" y="548" width="220" height="56" rx="6"/>
  <text class="b" x="534" y="571" text-anchor="middle">GitHub Actions</text>
  <text class="s m" x="534" y="592" text-anchor="middle">sync-to-hf.yml</text>
  <path class="edge" d="M534,548 V494" marker-end="url(#ah)"/>
  <text class="s" x="544" y="526">force-pushes main to the Space on every push</text>
  <text class="s" x="534" y="626" text-anchor="middle">HF_TOKEN comes from the repo’s GitHub secrets</text>
</svg>
